<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Scroll Recorder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Scroll Recorder</h1>
    <button id="theme" class="icon-btn" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema"></button>
  </header>

  <button id="play" class="primary" type="button">▶ Iniciar scroll</button>

  <section>
    <label for="speed">Velocidade <output id="speedOut">120</output> px/s</label>
    <input id="speed" type="range" min="10" max="1000" step="10" value="120">
    <div class="presets">
      <button type="button" data-speed="60">Lento</button>
      <button type="button" data-speed="150">Médio</button>
      <button type="button" data-speed="400">Rápido</button>
    </div>
  </section>

  <section>
    <button id="direction" type="button">⬇ Descer</button>
  </section>

  <details class="opts" open>
    <summary>Opções de gravação</summary>
    <label class="field">Duração (segundos)
      <input id="duration" type="number" min="3" step="1" inputmode="numeric" placeholder="até o fim da página">
    </label>
    <small title="Com valor, grava e rola por esse tempo, ou até o fim da página, o que vier primeiro.">Vazio = até o fim da página.</small>
    <div class="field">Salvar em
      <div class="folder">
        <span id="folderLabel"></span>
        <button id="folderBtn" type="button" title="Escolher a pasta de destino">📁 Pasta…</button>
      </div>
    </div>
    <label class="check"><input id="ask" type="checkbox"> Perguntar sempre onde salvar</label>
  </details>

  <section class="record">
    <button id="record" class="rec" type="button">⏺ Gravar e rolar</button>
    <small id="recHint">Contagem de 3s, rola e salva o vídeo.</small>
  </section>

  <section id="unsaved" class="row" hidden>
    <button id="retry" class="primary" type="button">💾 Salvar de novo</button>
    <button id="discard" type="button">🗑 Descartar</button>
  </section>

  <p id="status" role="status"></p>
  <script src="../lib/folder-store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
